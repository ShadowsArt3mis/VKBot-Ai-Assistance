version: "3.1"
nlu:
- intent: greet
  examples: |
    - Hail, traveler!
    - Greetings, seeker of lore.
    - Hark! What news dost thou bring?
    - Hail and well met!
    - Skol!
    - May the gods be with you.
    - A fair welcome to thee.
- intent: goodbye
  examples: |
    - May your path be fair.
    - Farewell, until we meet again.
    - Go now in peace.
    - Skol and safe travels!
    - May the Bifrost guide you.
    - Hailsa! (Farewell)
    - Until the next saga!
- intent: inquire_god
  examples: |
    - who is [Odin](god_name)
    - tell me about [Thor](god_name)
    - what do you know about [Loki](god_name)
- intent: inquire_goddess
  examples: |
    - who is [Frigg](goddess_name)
    - tell me about [Freyja](goddess_name)
    - what do you know about [Idunn](goddess_name)
- intent: inquire_creature
  examples: |
    - what is a [Valkyrie](creature_name)
    - tell me about [Fenrir](creature_name)
    - what do you know about [Jormungandr](creature_name)
- intent: inquire_realm
  examples: |
    - what is [Midgard](realm_name)
    - tell me about [Asgard](realm_name)
    - what do you know about [Jotunheim](realm_name)
- intent: inquire_bifrost
  examples: |
    - tell me about the [Bifrost](realm_name)
    - what is the [Bifrost bridge](realm_name)
    - what is the story of the [Rainbow bridge](realm_name)
- intent: inquire_asgard
  examples: |
    - tell me about [Asgard](realm_name)
    - what is [Asgard](realm_name)
    - what is the story of [Asgard](realm_name)
- intent: inquire_aesir_vanir
  examples: |
    - tell me about the [Æsir](realm_name) and [Vanir](realm_name)
    - what is the war between the [Æsir](realm_name) and [Vanir](realm_name)
    - what is the story between the [Æsir](realm_name) and [Vanir](realm_name)
- intent: inquire_runes
  examples: |
    - what is [Fehu](rune_name)
    - tell me about the meaning of [Uruz](rune_name)
    - what are the [runes](rune_name)
- intent: inquire_eddas
  examples: |
    - what is the [Poetic Edda](edda_name)
    - tell me about the [Prose Edda](edda_name)
    - what are the [Eddas](edda_name)
- intent: inquire_stories
  examples: |
    - tell me a story about [Thor](god_name)
    - what are the stories of [creation](story_topic)
    - tell me the story of [Ragnarok](story_topic)
- intent: inquire_sagas
  examples: |
    - tell me about the [Volsunga Saga](saga_title)
    - what is the [Saga of the Jomsvikings](saga_title)
    - what are the [Norse Sagas](saga_title)
- intent: inquire_god_story
  examples: |
    - what's the story of [Odin](god_name)
    - tell me a tale about [Thor](god_name)
    - do you know any stories about [Loki](god_name)
- intent: inquire_god_domain
  examples: |
    - what is [Odin](god_name)'s domain?
    - what is [Thor](god_name) the god of?
    - what are [Freyja](goddess_name)'s responsibilities?
    - what domain does [Heimdall](god_name) have?
- intent: inquire_god_comparison
  examples: |
    - how is [Odin](god_name) different from [Thor](god_name)?
    - compare [Loki](god_name) and [Heimdall](god_name)
    - similarities between [Freyja](goddess_name) and [Frigg](goddess_name)
    - what's the difference between the powers of [Tyr](god_name) and [Thor](god_name)
